<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transit Region Visualizer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --surface: #161922;
    --border: #252a36;
    --text: #e2e8f0;
    --muted: #64748b;
    --accent: #38bdf8;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 1000;
  }

  header h1 {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    white-space: nowrap;
  }

  .header-divider { width: 1px; height: 20px; background: var(--border); }

  .upload-area {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
  }

  .upload-area label {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  .file-inputs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .file-btn {
    position: relative;
    cursor: pointer;
  }

  .file-btn input[type=file] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
  }

  .file-btn span {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    background: var(--border);
    border: 1px solid #2d3748;
    border-radius: 4px;
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    color: var(--text);
    transition: border-color 0.2s;
    white-space: nowrap;
  }

  .file-btn:hover span { border-color: var(--accent); color: var(--accent); }
  .file-btn.loaded span { border-color: #22c55e; color: #22c55e; }

  .load-btn {
    padding: 5px 14px;
    background: var(--accent);
    color: #0d0f14;
    border: none;
    border-radius: 4px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: opacity 0.2s;
    white-space: nowrap;
  }

  .load-btn:hover { opacity: 0.85; }
  .load-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .status {
    font-size: 11px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    white-space: nowrap;
  }

  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  #map {
    flex: 1;
    background: #0a0c10;
  }

  .sidebar {
    width: 260px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }

  .sidebar-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .controls {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .control-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .control-label {
    font-size: 11px;
    color: var(--muted);
  }

  .toggle {
    display: flex;
    gap: 4px;
  }

  .toggle-btn {
    padding: 3px 8px;
    font-size: 10px;
    font-family: 'Space Mono', monospace;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .toggle-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #0d0f14;
    font-weight: 700;
  }

  .stats {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .stat-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
  }

  .stat-val {
    font-family: 'Space Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }

  .stat-lbl {
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
  }

  .region-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .region-list::-webkit-scrollbar { width: 4px; }
  .region-list::-webkit-scrollbar-track { background: transparent; }
  .region-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .region-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s;
    border: 1px solid transparent;
  }

  .region-item:hover { background: var(--bg); }
  .region-item.selected { background: var(--bg); border-color: var(--border); }

  .region-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .region-name {
    font-size: 12px;
    flex: 1;
  }

  .region-counts {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    display: flex;
    gap: 6px;
  }

  .region-counts .gate-count { color: #fbbf24; }

  .info-panel {
    position: absolute;
    bottom: 20px;
    left: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    max-width: 280px;
    z-index: 500;
    font-size: 12px;
    display: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  .info-panel.visible { display: block; }

  .info-name {
    font-weight: 500;
    margin-bottom: 4px;
  }

  .info-row {
    display: flex;
    gap: 8px;
    color: var(--muted);
    font-size: 11px;
    font-family: 'Space Mono', monospace;
  }

  .info-badge {
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  .badge-gate { background: #fbbf2422; color: #fbbf24; border: 1px solid #fbbf2444; }
  .badge-stop { background: #38bdf822; color: #38bdf8; border: 1px solid #38bdf844; }

  .legend {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--muted);
  }

  .legend-icon {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .dot-normal {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #38bdf8;
  }

  .dot-gate {
    width: 12px; height: 12px;
    border-radius: 2px;
    background: #fbbf24;
    transform: rotate(45deg);
  }

  /* Leaflet overrides */
  .leaflet-container { background: #0a0c10 !important; }
  .leaflet-tile { filter: brightness(0.35) saturate(0.3); }
  .leaflet-control-zoom a { background: var(--surface) !important; color: var(--text) !important; border-color: var(--border) !important; }
  .leaflet-control-attribution { background: rgba(13,15,20,0.8) !important; color: var(--muted) !important; font-size: 9px !important; }
</style>
</head>
<body>

<header>
  <h1>Region Visualizer</h1>
  <div class="header-divider"></div>
  <div class="upload-area">
    <label>Load your own data:</label>
    <div class="file-inputs">
      <div class="file-btn" id="btn-stops">
        <input type="file" id="file-stops" accept=".txt,.csv" onchange="fileLoaded('stops',this)">
        <span>📍 stops.txt</span>
      </div>
      <div class="file-btn" id="btn-regions">
        <input type="file" id="file-regions" accept=".json,.pkl" onchange="fileLoaded('regions',this)">
        <span>🗺 regions.json</span>
      </div>
      <div class="file-btn" id="btn-gates">
        <input type="file" id="file-gates" accept=".json,.pkl" onchange="fileLoaded('gates',this)">
        <span>🚪 gates.json</span>
      </div>
    </div>
    <button class="load-btn" onclick="loadUploadedFiles()">Load</button>
    <span class="status" id="status">Showing: Rajkot (demo data)</span>
  </div>
</header>

<div class="main">
  <div id="map"></div>

  <div class="sidebar">
    <div class="sidebar-header">Regions</div>

    <div class="controls">
      <div class="control-row">
        <span class="control-label">Show stops</span>
        <div class="toggle">
          <button class="toggle-btn active" onclick="setStopMode('all',this)">All</button>
          <button class="toggle-btn" onclick="setStopMode('gates',this)">Gates only</button>
          <button class="toggle-btn" onclick="setStopMode('none',this)">None</button>
        </div>
      </div>
      <div class="control-row">
        <span class="control-label">Filter region</span>
        <div class="toggle">
          <button class="toggle-btn active" onclick="setFilter('all',this)">All</button>
          <button class="toggle-btn" onclick="setFilter('selected',this)">Selected</button>
        </div>
      </div>
    </div>

    <div class="stats">
      <div class="stat-box">
        <div class="stat-val" id="stat-regions">—</div>
        <div class="stat-lbl">Regions</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="stat-stops">—</div>
        <div class="stat-lbl">Stops</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="stat-gates">—</div>
        <div class="stat-lbl">Gate stops</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="stat-sel">—</div>
        <div class="stat-lbl">Selected</div>
      </div>
    </div>

    <div class="region-list" id="region-list"></div>

    <div class="legend">
      <div class="legend-item">
        <div class="legend-icon"><div class="dot-normal" style="background:#888"></div></div>
        Regular stop
      </div>
      <div class="legend-item">
        <div class="legend-icon"><div class="dot-gate"></div></div>
        Gate stop (region boundary)
      </div>
    </div>
  </div>
</div>

<div class="info-panel" id="info-panel">
  <div class="info-name" id="info-name"></div>
  <div class="info-row" id="info-row"></div>
</div>

// ─── State ────────────────────────────────────────────────────────────
let currentData = null;
let map = null;
let markers = [];
let stopMode = 'all';
let filterMode = 'all';
let selectedRegion = null;
let uploadedFiles = {};

// ─── 24-colour palette (perceptually distinct, dark-theme friendly) ───
const PALETTE = [
  '#38bdf8','#f472b6','#4ade80','#fb923c','#a78bfa',
  '#facc15','#2dd4bf','#f87171','#818cf8','#34d399',
  '#fbbf24','#60a5fa','#e879f9','#a3e635','#fb7185',
  '#38bdf8','#c084fc','#86efac','#fca5a5','#67e8f9',
  '#d8b4fe','#6ee7b7','#fcd34d','#93c5fd'
];

function regionColor(id) {
  return PALETTE[id % PALETTE.length];
}

// ─── Map init ─────────────────────────────────────────────────────────
function initMap(center) {
  if (map) map.remove();
  map = L.map('map', { zoomControl: true }).setView(center, 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 19
  }).addTo(map);
  map.on('click', () => {
    selectedRegion = null;
    document.getElementById('info-panel').classList.remove('visible');
    updateMarkers();
    updateRegionList();
  });
}

// ─── Build markers ────────────────────────────────────────────────────
function buildMarkers(data) {
  markers.forEach(m => m.remove());
  markers = [];

  data.stops.forEach(stop => {
    const color = stop.region >= 0 ? regionColor(stop.region) : '#555';
    const isGate = stop.is_gate;

    let icon;
    if (isGate) {
      icon = L.divIcon({
        className: '',
        html: `<div style="
          width:14px;height:14px;
          background:${color};
          border:2px solid #fff;
          transform:rotate(45deg);
          box-shadow:0 0 6px ${color}88;
          border-radius:2px;
        "></div>`,
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });
    } else {
      icon = L.divIcon({
        className: '',
        html: `<div style="
          width:8px;height:8px;
          background:${color};
          border-radius:50%;
          opacity:0.85;
          box-shadow:0 0 4px ${color}66;
        "></div>`,
        iconSize: [8, 8],
        iconAnchor: [4, 4]
      });
    }

    const m = L.marker([stop.lat, stop.lon], { icon })
      .on('click', e => {
        e.originalEvent.stopPropagation();
        showInfo(stop, color);
        selectedRegion = stop.region;
        updateMarkers();
        updateRegionList();
      });

    m._stopData = stop;
    markers.push(m);
  });

  updateMarkers();
}

function updateMarkers() {
  markers.forEach(m => {
    const stop = m._stopData;
    const visible = isVisible(stop);
    const dimmed = selectedRegion !== null && stop.region !== selectedRegion;

    if (visible) {
      if (!map.hasLayer(m)) m.addTo(map);
      const el = m.getElement();
      if (el) el.style.opacity = dimmed ? '0.15' : '1';
    } else {
      if (map.hasLayer(m)) m.remove();
    }
  });
}

function isVisible(stop) {
  if (stopMode === 'none') return false;
  if (stopMode === 'gates' && !stop.is_gate) return false;
  if (filterMode === 'selected' && selectedRegion !== null && stop.region !== selectedRegion) return false;
  return true;
}

// ─── Info panel ───────────────────────────────────────────────────────
function showInfo(stop, color) {
  const panel = document.getElementById('info-panel');
  document.getElementById('info-name').textContent = stop.name || `Stop ${stop.id}`;
  document.getElementById('info-row').innerHTML = `
    <span>ID: ${stop.id}</span>
    <span>Region ${stop.region}</span>
    ${stop.is_gate
      ? '<span class="info-badge badge-gate">GATE</span>'
      : '<span class="info-badge badge-stop">STOP</span>'}
  `;
  panel.style.borderColor = color;
  panel.classList.add('visible');
}

// ─── Region list ──────────────────────────────────────────────────────
function buildRegionList(data) {
  const regionStats = {};
  data.stops.forEach(s => {
    if (!regionStats[s.region]) regionStats[s.region] = { stops: 0, gates: 0 };
    regionStats[s.region].stops++;
    if (s.is_gate) regionStats[s.region].gates++;
  });

  const list = document.getElementById('region-list');
  list.innerHTML = '';

  const regions = Object.keys(regionStats).map(Number).sort((a,b) => a-b);
  regions.forEach(rid => {
    const { stops, gates } = regionStats[rid];
    const color = regionColor(rid);
    const item = document.createElement('div');
    item.className = 'region-item';
    item.innerHTML = `
      <div class="region-dot" style="background:${color}"></div>
      <div class="region-name">Region ${rid}</div>
      <div class="region-counts">
        <span>${stops}s</span>
        <span class="gate-count">${gates}g</span>
      </div>
    `;
    item.onclick = () => {
      selectedRegion = selectedRegion === rid ? null : rid;
      document.getElementById('info-panel').classList.remove('visible');
      updateMarkers();
      updateRegionList();
      if (selectedRegion !== null) zoomToRegion(rid, data);
    };
    list.appendChild(item);
  });

  // stats
  document.getElementById('stat-regions').textContent = regions.length;
  document.getElementById('stat-stops').textContent = data.stops.length;
  document.getElementById('stat-gates').textContent = data.stops.filter(s=>s.is_gate).length;
}

function updateRegionList() {
  document.querySelectorAll('.region-item').forEach((item, i) => {
    const regionId = parseInt(item.querySelector('.region-name').textContent.replace('Region ',''));
    item.classList.toggle('selected', regionId === selectedRegion);
  });
  document.getElementById('stat-sel').textContent =
    selectedRegion !== null ? `R${selectedRegion}` : '—';
}

function zoomToRegion(rid, data) {
  const pts = data.stops.filter(s => s.region === rid);
  if (!pts.length) return;
  const lats = pts.map(s=>s.lat), lons = pts.map(s=>s.lon);
  map.fitBounds([
    [Math.min(...lats)-0.005, Math.min(...lons)-0.005],
    [Math.max(...lats)+0.005, Math.max(...lons)+0.005]
  ]);
}

// ─── Controls ─────────────────────────────────────────────────────────
function setStopMode(mode, btn) {
  stopMode = mode;
  btn.closest('.toggle').querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updateMarkers();
}

function setFilter(mode, btn) {
  filterMode = mode;
  btn.closest('.toggle').querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updateMarkers();
}

// ─── Load data ────────────────────────────────────────────────────────
function loadData(data, label) {
  currentData = data;
  const lats = data.stops.map(s=>s.lat), lons = data.stops.map(s=>s.lon);
  const center = [
    (Math.min(...lats)+Math.max(...lats))/2,
    (Math.min(...lons)+Math.max(...lons))/2
  ];
  initMap(center);
  buildMarkers(data);
  buildRegionList(data);
  document.getElementById('status').textContent = `Showing: ${label}`;
}

// ─── File upload handling ─────────────────────────────────────────────
function fileLoaded(type, input) {
  uploadedFiles[type] = input.files[0];
  document.getElementById(`btn-${type === 'stops' ? 'stops' : type}`).classList.add('loaded');
}

function loadUploadedFiles() {
  const hasStops = uploadedFiles.stops;
  const hasRegions = uploadedFiles.regions;
  const hasGates = uploadedFiles.gates;

  if (!hasStops || !hasRegions || !hasGates) {
    alert('Please select all three files: stops.txt, regions.json, and gates.json');
    return;
  }

  document.getElementById('status').textContent = 'Loading...';

  Promise.all([
    readFile(uploadedFiles.stops),
    readFile(uploadedFiles.regions),
    readFile(uploadedFiles.gates)
  ]).then(([stopsText, regionsText, gatesText]) => {
    try {
      const stops = parseStops(stopsText);
      const regions = JSON.parse(regionsText);
      const gatesByRegion = JSON.parse(gatesText);

      const allGates = new Set(
        Object.values(gatesByRegion).flat().map(Number)
      );

      const stopData = stops.map(s => ({
        id: Number(s.stop_id),
        name: s.stop_name || '',
        lat: parseFloat(s.stop_lat),
        lon: parseFloat(s.stop_lon),
        region: regions[String(s.stop_id)] ?? regions[Number(s.stop_id)] ?? -1,
        is_gate: allGates.has(Number(s.stop_id))
      })).filter(s => !isNaN(s.lat) && !isNaN(s.lon));

      loadData({ stops: stopData, gates_by_region: gatesByRegion }, 'Uploaded data');
    } catch(e) {
      alert('Error parsing files: ' + e.message);
      document.getElementById('status').textContent = 'Error loading files';
    }
  });
}

function readFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsText(file);
  });
}

function parseStops(text) {
  const lines = text.trim().split('\n');
  const header = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g,''));
  return lines.slice(1).map(line => {
    const vals = line.split(',').map(v => v.trim().replace(/^"|"$/g,''));
    const obj = {};
    header.forEach((h,i) => obj[h] = vals[i] || '');
    return obj;
  });
}

// ─── Boot ─────────────────────────────────────────────────────────────
loadData(DEMO_DATA, 'Rajkot (demo data)');
</script>
